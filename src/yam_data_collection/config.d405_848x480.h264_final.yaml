# Direct-H.264 final-output variant of the 848x480@60 validation candidate.
# This file is deliberately separate from config.d405_848x480.validation.yaml:
# it publishes the verified live H.264 MP4 files as final assets and never
# runs the offline x265 transcode. Existing HEVC datasets and configurations
# remain unchanged.
# Intrinsics were measured with the 2.6 cm chessboard on 2026-08-20.
collection_config:
  dataset_dir: data/yam_pick_and_place_d405_848x480_h264_final
  state_save_freq: 180.0
  target_fps: 60.0
  validation_profile: yam_60hz
  timeout_threshold_s: 1.0
  total_sampled_frames: 200000
  # The live encoder is the final encoder in this configuration. Capture
  # closes and verifies these MP4s, then publishes them without re-encoding.
  video_codec: libx264
  video_crf: 23
  video_preset: ultrafast
  video_threads: 1
  live_video_codec: libx264
  live_video_crf: 23
  live_video_preset: ultrafast
  live_video_threads: 1
  live_video_queue_size: 120
  allow_uncalibrated_intrinsics: false

camera_test_config:
  output_dir: camera_tests/d405_848x480_h264_final
  duration_s: 60.0
  timeout_threshold_s: 1.0
  video_codec: libx264
  video_crf: 23
  video_preset: ultrafast
  video_threads: 1
  video_queue_size: 240
  fps_tolerance: 0.5
  validation_profile: yam_60hz
  max_gap_factor: 2.1

telemetry:
  left_follower:
    host: 127.0.0.1
    port: 1235
  right_follower:
    host: 127.0.0.1
    port: 1234
  left_leader:
    host: 127.0.0.1
    port: 1245
  right_leader:
    host: 127.0.0.1
    port: 1244

cameras:
