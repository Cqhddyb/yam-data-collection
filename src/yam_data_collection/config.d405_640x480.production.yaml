# Production capture configuration for D405 640x480@60.
# Keep this output isolated from validation and older 848x480 datasets.
# The shared 30 Hz profiles and D435 960x540@60 intrinsics were measured with
# the 2.6 cm chessboard on 2026-08-20. D405 640x480@60 retains its prior values.
collection_config:
  dataset_dir: data/yam_pick_and_place_d405_640x480_60hz
  # The selected --mode fixes this to 180 Hz. Kept here for standalone legacy configs.
  state_save_freq: 180.0
  # The selected --mode fixes the camera target and validation profile.
  target_fps: 60.0
  validation_profile: yam_60hz
  timeout_threshold_s: 1.0
  total_sampled_frames: 50000
  # Final episode assets remain HEVC. These settings are applied only by the
  # offline `yam-data-collect transcode` step, never while teleoperating.
  video_codec: libx265
  video_crf: 23
  # The existing video_* keys are the final HEVC encoder settings, retained for
  # backwards-compatible host configurations.
  video_preset: ultrafast
  video_threads: 4
  # These independent live settings control temporary files under videos_live/
  # during teleoperation. libx264 ultrafast prevents three x265 encoders from
  # thermally throttling the recorder CPU.
  live_video_codec: libx264
  live_video_crf: 23
  live_video_preset: ultrafast
  live_video_threads: 1
  # Backpressure is an integrity guard, not a frame-drop buffer. A full queue
  # aborts the episode instead of silently losing camera frames.
  live_video_queue_size: 120
  # Keep false for real data. Set true only for a camera/telemetry smoke test.
  allow_uncalibrated_intrinsics: false

# Standalone camera timing tests use this directory and never touch the
# production episode directory. The selected --mode supplies the 60 Hz stream
# profiles and appends its subdirectory below this path.
camera_test_config:
  output_dir: camera_tests/d405_640x480_production
  duration_s: 60.0
  timeout_threshold_s: 1.0
  video_codec: libx264
  video_crf: 23
  video_preset: ultrafast
  video_threads: 1
  video_queue_size: 240
  fps_tolerance: 0.5
  validation_profile: yam_60hz
  max_gap_factor: 2.1

telemetry:
  left_follower:
    host: 127.0.0.1
    port: 1235
  right_follower:
    host: 127.0.0.1
    port: 1234
  left_leader:
    host: 127.0.0.1
    port: 1245
  right_leader:
    host: 127.0.0.1
    port: 1244

cameras:
  cam_high:
    serial: "REPLACE_CAM_HIGH_SERIAL"  # D435; discovered on this host.
    frame_id: camera_high_color_optical_frame
  cam_left:
    serial: "REPLACE_RETIRED_CAMERA_SERIAL"  # D405; verify left/right after mounting.
    frame_id: camera_left_color_optical_frame
  cam_right:
    serial: "REPLACE_CAM_RIGHT_SERIAL"  # D405; verify left/right after mounting.
    frame_id: camera_right_color_optical_frame

# Select this contract at runtime with --mode 30hz or --mode 60hz. Each mode
# writes under its own dataset subdirectory, preventing incompatible episodes
# from sharing a record_config.yaml or episode-number sequence.
capture_modes:
  30hz:
    # Do not mix this qualified 720p/YUYV/one-worker profile with historical
    # 1080p recordings stored under the old 30hz directory.
    dataset_subdir: 30hz_720p_yuyv_threads1
    validation_profile: yam_30hz
    collection_config:
      video_threads: 1
    cameras:
      cam_high:
        width: 1280
        height: 720
        fps: 30
        stream_format: yuyv
        intrinsics:
